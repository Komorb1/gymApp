name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test-before-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run cargo tests
        working-directory: src-tauri
        run: cargo test --verbose

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  release-windows:
    needs: test-before-release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GymApp ${{ github.ref_name }}"
          releaseBody: |
            Unsigned ${{ github.ref_name }} test build for Windows reception desks. Windows SmartScreen may show an unknown publisher warning.

            ### Changes in ${{ github.ref_name }}
            - Member details subscriptions table fits every column and scrolls instead of clipping
            - Password fields have a show/hide button that stays put
            - Editing an expired or cancelled membership asks for confirmation after saving
            - Expired memberships appear only for the last 30 days on the dashboard and subscriptions page
            - The subscriptions page has a Partially Paid tab in place of Pending approval; pending discounts stay in Active
            - The unpaid column is now named Un-paid Amount
            - The gym name entered during setup replaces "GymApp" in the sidebar and the window title
          releaseDraft: false
          prerelease: true
          args: --target x86_64-pc-windows-msvc

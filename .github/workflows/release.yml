name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test-before-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run cargo tests
        working-directory: src-tauri
        run: cargo test --verbose

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  release-windows:
    needs: test-before-release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GymApp ${{ github.ref_name }}"
          releaseBody: |
            Unsigned ${{ github.ref_name }} test build for Windows reception desks. Windows SmartScreen may show an unknown publisher warning.

            ### Changes in ${{ github.ref_name }}
            - The sign-in screen, first-time setup, loading screen, and sidebar now use the gym logo
            - Prices and payments show the dirham symbol in both Arabic and English
            - The subscriptions list separates Paid Amount, Plan Price, and the new Balance Amount column
            - Editing a membership keeps the plan price it was sold at, even after the plan's price changes
            - Signing out after first-time setup returns to the sign-in screen instead of the setup form
            - Passwords must be at least 6 characters for the first account and for new staff accounts
            - Member WhatsApp numbers accept digits only and cannot be duplicated between members
            - Date fields are readable in dark mode and open the picker from anywhere in the field
            - Staff self-registration was removed from the sign-in screen; management adds staff in Settings
          releaseDraft: false
          prerelease: true
          args: --target x86_64-pc-windows-msvc

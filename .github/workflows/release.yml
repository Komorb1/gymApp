name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test-before-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Build the Lite edition
        run: pnpm build:lite

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run cargo tests
        working-directory: src-tauri
        run: cargo test --verbose

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run cargo tests (Lite edition)
        working-directory: src-tauri
        run: cargo test --verbose --features lite

      - name: Clippy (Lite edition)
        working-directory: src-tauri
        run: cargo clippy --all-targets --features lite -- -D warnings

  release-windows:
    needs: test-before-release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SK GYM ${{ github.ref_name }}"
          releaseBody: |
            Unsigned ${{ github.ref_name }} test build for Windows reception desks. Windows SmartScreen may show an unknown publisher warning.

            ### Two installers in this release
            - **SK GYM** (complete): members, memberships, plans, dashboard, settings, reports, activity log and staff accounts.
            - **SK GYM Lite**: dashboard, members, memberships and plans only. No login, no accounts, no settings, reports or activity pages. It keeps its own data folder, so both editions can be installed and used side by side.

            ### Changes in ${{ github.ref_name }}
            - Added the SK GYM Lite edition, built from the same source as the complete edition
            - The application is now named SK GYM: installer, window title, in-app name and page title
            - The word "Subscriptions" is now "Memberships" everywhere, in Arabic and English
            - The memberships table shows Paid Amount, Plan Price and a new Balance Amount column
            - Amounts show the dirham symbol, and date fields use a calendar icon that stays visible in dark mode and opens from anywhere in the field
            - Editing a plan never changes the price stored with an existing membership, not even when a discount is edited
            - A WhatsApp number already used by another member is refused, with the message in the language of the interface
            Note: the repository name, the app identifier and your existing data are unchanged.
          releaseDraft: false
          prerelease: true
          args: --target x86_64-pc-windows-msvc

      - name: Build the Lite edition
        run: pnpm tauri build --config src-tauri/tauri.lite.conf.json --features lite --target x86_64-pc-windows-msvc

      - name: Attach the Lite installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${{ github.ref_name }}"
          installers=(
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          )
          if [ ${#installers[@]} -eq 0 ]; then
            echo "No Lite installers found" >&2
            exit 1
          fi
          for installer in "${installers[@]}"; do
            echo "Attaching $installer"
            gh release upload "$tag" "$installer" --clobber
          done
          gh release view "$tag" --json tagName,assets

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test-before-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Build the Lite edition
        run: pnpm build:lite

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run cargo tests
        working-directory: src-tauri
        run: cargo test --verbose

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run cargo tests (Lite edition)
        working-directory: src-tauri
        run: cargo test --verbose --features lite

      - name: Clippy (Lite edition)
        working-directory: src-tauri
        run: cargo clippy --all-targets --features lite -- -D warnings

  release-windows:
    needs: test-before-release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SK GYM ${{ github.ref_name }}"
          releaseBody: |
            Unsigned ${{ github.ref_name }} test build for Windows reception desks. Windows SmartScreen may show an unknown publisher warning.

            ### Two installers in this release
            - **SK GYM** (complete): members, memberships, plans, dashboard, settings, reports, activity log and staff accounts.
            - **SK GYM Lite**: dashboard, members, memberships and plans only. No login, no accounts, no settings, reports or activity pages. It keeps its own data folder, so both editions can be installed and used side by side.

            ### Changes in ${{ github.ref_name }}
            - Editing a member now shows up on their memberships: the memberships list, the dashboard expiring list and every membership window show the member as they are recorded now, while each membership keeps the plan price and the history it was created with
            - The new membership form asks for the start date only; the created date is stamped for you when you save
            - Fixed the window freezing after saving an edited membership from a member's account page, which used to leave the app unresponsive until it was closed and reopened
            - Every table now reads in the order the desk works in: the members list shows created, member id, name, phone and email, with the actions at the end
            - Both membership tables share one column order: created, membership id, member details, plan, start date, end date, plan price, paid amount, un-paid amount, payment type, status, membership notes and actions
            - A membership's plan price, paid amount and un-paid amount are separate columns now instead of one combined payment cell, so the balance is readable at a glance
            - Rows that would carry three or more actions show a single "more actions" button instead of a row of stacked buttons
            - Table text no longer wraps into crowded cells: headers, dates, ids and amounts each stay on one line, and amounts line up on their digits
            - Long membership notes are clipped to their column and shown in full when you hover them
            - Tables that were cutting off wide content scroll inside their own box, so the page itself never moves sideways
            - The memberships page search box sits directly beside the New Membership button, matching the members page, and the page no longer repeats its own title
            - Column headings read "Un-Paid Amount" and "Payment Type" in both membership tables, the member page and the membership windows
            - Memberships can now be backed up and restored: a manual button, plus an automatic backup once a day at a time you choose
            - You pick where the backups are kept, so a USB drive or a OneDrive/Drive folder gives you an off-machine copy; a restore can also be taken from any folder you browse to
            - Each backup keeps the database, the member photos and an information file, and the page lists every backup with its date, size and contents
            - Restoring shows what is inside the backup against your current data, saves a safety copy first, and reopens the app on the restored data
            - Automatic backups keep the newest 14 and clean up after themselves; backups taken by hand are never deleted automatically
            - The complete edition has Backup in Settings, the Lite edition has its own Backup page in the sidebar
            - The backup list shows ten entries per page and scrolls inside its own box, so a long list never pushes the page around
            - The memberships page has a search box that finds a membership by id, plan, start date, end date, created date, status or payment status, and it narrows the rows the status tabs list, so cancelled or replaced memberships no longer show up in results
            - Renewing an already expired membership now says the new membership starts today
            - Arabic text no longer carries diacritics the desk keyboard cannot type, so labels like "مجمد" can be searched and matched
            - Every membership records how it was paid, cash or bank transfer. The new membership window, the renewal window and the edit membership window each offer those two choices, and both membership tables show the value in its own column. Memberships created before this was added show a dash until someone sets it
            - A membership can be discounted by a percentage or by a flat amount: pick the type, enter the value, and the price and remaining balance update as you type. Use one or the other, never both, and a flat discount is capped at the plan price so a balance can never go below zero. A discount from a staff account still waits for management approval, and management applies its own directly. The badge beside the status names the discount you gave, whether that is 10% or 50.00 AED
            - Cancelling a membership now asks for a reason and will not confirm until one is written. The reason is kept with the membership, shows in the activity log, and appears when you hover the Cancelled badge
            - A member's phone number is entered as the fixed prefix +9715 followed by 8 digits, so every new or changed number is a full UAE mobile number. Members saved earlier with a local-format number keep working and show a note until someone re-enters the 8 digits
            - Created dates show the time of day as well as the date: memberships in both membership tables, the members list, and the member's own page. On Windows the time always carries an AM or PM marker instead of a 24-hour clock
            - Renewing a membership that is still running no longer overlaps the day it ends: the new membership starts the day after the old one's last day, and the renewal window tells you that start date before you confirm. Renewing an expired membership still starts today
            - Cancelling a membership that was only part paid no longer leaves it listed under Partially paid; the amount paid stays on the membership's own history
            - The member account page tabs are now called Member and Membership instead of the plural wording
          releaseDraft: false
          prerelease: true
          args: --target x86_64-pc-windows-msvc

      - name: Build the Lite edition
        run: pnpm tauri build --config src-tauri/tauri.lite.conf.json --features lite --target x86_64-pc-windows-msvc

      - name: Attach the Lite installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${{ github.ref_name }}"
          installers=(
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          )
          if [ ${#installers[@]} -eq 0 ]; then
            echo "No Lite installers found" >&2
            exit 1
          fi
          for installer in "${installers[@]}"; do
            echo "Attaching $installer"
            gh release upload "$tag" "$installer" --clobber
          done
          gh release view "$tag" --json tagName,assets

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test-before-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Build the Lite edition
        run: pnpm build:lite

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run cargo tests
        working-directory: src-tauri
        run: cargo test --verbose

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run cargo tests (Lite edition)
        working-directory: src-tauri
        run: cargo test --verbose --features lite

      - name: Clippy (Lite edition)
        working-directory: src-tauri
        run: cargo clippy --all-targets --features lite -- -D warnings

  release-windows:
    needs: test-before-release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SK GYM ${{ github.ref_name }}"
          releaseBody: |
            Unsigned ${{ github.ref_name }} test build for Windows reception desks. Windows SmartScreen may show an unknown publisher warning.

            ### Changes in ${{ github.ref_name }}
            - The application is now named SK GYM: installer, window title, in-app name and page title
            - The word "Subscriptions" is now "Memberships" everywhere, in Arabic and English
            - The installer now carries the gym logo instead of the default icon, and the app installs under a new folder and file name so Windows cannot show a cached old icon
            Note: the repository name and the app identifier are unchanged, so your existing data keeps working.
          releaseDraft: false
          prerelease: true
          args: --target x86_64-pc-windows-msvc

      - name: Build the Lite edition
        run: pnpm tauri build --config src-tauri/tauri.lite.conf.json --features lite --target x86_64-pc-windows-msvc

      - name: Attach the Lite installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${{ github.ref_name }}"
          installers=(
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          )
          if [ ${#installers[@]} -eq 0 ]; then
            echo "No Lite installers found" >&2
            exit 1
          fi
          for installer in "${installers[@]}"; do
            echo "Attaching $installer"
            gh release upload "$tag" "$installer" --clobber
          done
          gh release view "$tag" --json tagName,assets
